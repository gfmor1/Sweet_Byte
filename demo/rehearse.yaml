# Local rehearsal only (the platform ignores this file). Run from the demo/ folder:
#
#   docker compose -f compose.yaml -f rehearse.yaml up
#
# Open http://localhost:8088. Start again from an empty database with:
#   docker compose -f compose.yaml -f rehearse.yaml down -v
#
# If compose.yaml ever uses a platform secret (${secret:NAME}), local Docker Compose does not know
# that syntax: make a copy with  sed 's/\${secret:\([A-Z0-9_]*\)}/${\1:-}/' compose.yaml > compose.local.yaml
# and use compose.local.yaml instead (it is gitignored).
services:
  web:
    ports:
      - "8088:80"
