# SweetByte on the SOEN 343 demo platform.
#   web       nginx, public: / -> frontend, /api/ -> backend
#   frontend  Next.js (next start :3001)
#   backend   Spring Boot (:8080), schema by JPA, demo data by SeedDataLoader at startup
#   db        local Postgres (replaces the hosted Supabase database)
# Login is handled by the backend itself (JWT), so the demo needs no external service and no secret.
# Image tags: the commit SHA printed by the "Publish demo images" workflow (run on 1dbad09). Update after each publish.
x-demo:
  web: web
  port: 80

services:
  web:
    image: ghcr.io/gfmor1/sweet_byte-web:1dbad09760941340346e5137c053ce0c8c0d06dc
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    image: ghcr.io/gfmor1/sweet_byte-frontend:1dbad09760941340346e5137c053ce0c8c0d06dc
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/3001'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  backend:
    image: ghcr.io/gfmor1/sweet_byte-backend:1dbad09760941340346e5137c053ce0c8c0d06dc
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sweetbyte
      SPRING_DATASOURCE_USERNAME: sweetbyte
      SPRING_DATASOURCE_PASSWORD: demo-password
      # Testing operator, created (or its password reset) at every start by SeedDataLoader.
      # Hardcoded on purpose for testing: anyone who reads this file can log in as operator.
      APP_SEED_OPERATOR_EMAIL: admin@sweetbyte.test
      APP_SEED_OPERATOR_PASSWORD: operator123
      APP_SEED_OPERATOR_NAME: Test Operator
      # Login tokens are signed with a random key chosen at each start (a restart logs everyone out).
      # To keep logins across restarts, save a JWT_SECRET (32+ characters) on the platform's
      # Secrets page and add:  JWT_SECRET: ${secret:JWT_SECRET}
      # trust X-Forwarded-* from the platform edge (passed on by nginx)
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sweetbyte
      POSTGRES_USER: sweetbyte
      POSTGRES_PASSWORD: demo-password
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sweetbyte -d sweetbyte"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
