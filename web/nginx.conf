# One public address: the browser only talks to nginx, so every API call is same-origin.
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Docker's DNS: names are looked up per request, so nginx starts even if a service is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API -> Spring Boot. No path after the port: /api/... is passed on unchanged.
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $http_host;   # keeps the port in a local rehearsal
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # no X-Forwarded-Proto line: the platform edge sends it (https) and nginx passes it on
        proxy_read_timeout 55s;
    }

    # Pages -> Next.js server (next start).
    location / {
        set $frontend http://frontend:3001;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 55s;
    }
}
