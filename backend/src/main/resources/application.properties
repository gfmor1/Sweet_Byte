# Supabase's pooler drops idle connections; recycle/ping ours first so a request never gets a dead one (transient 500s)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=60000
app.cors.allowed-origins=http://localhost:3001
server.port=8080

# update = Hibernate creates/alters tables (dev). Use validate once migrations exist.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

