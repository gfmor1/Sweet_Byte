spring.application.name=eats
spring.config.import=optional:classpath:application-local.properties

# Real password goes in application-local.properties (gitignored), never here.
# On the demo platform these are overridden by SPRING_DATASOURCE_* in demo/compose.yaml.
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.equpjznhzqkbhnnhpzbo
spring.datasource.password=
# Supabase's pooler drops idle connections; recycle/ping ours first so a request never gets a dead one (transient 500s)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=60000
app.cors.allowed-origins=http://localhost:3001
server.port=8080

# update = Hibernate creates/alters tables (dev). Use validate once migrations exist.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Login: this backend issues and verifies its own JWTs (HS256, see JwtConfig / TokenService).
# JWT_SECRET: at least 32 characters. Empty = random key at each start (logins end on restart).
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-hours=12

#Pricing Rules
pricing.delivery-fee=2.99
pricing.service-fee=1.50
pricing.small-order-threshold=15.00
pricing.small-order-surcharge=1.50



#Refund Rules
# how long after delivery a customer may request a refund
refund.window-minutes=90
